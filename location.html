
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Buzz | Our Location</title>

    <meta name="description" content="Visit Java Buzz Coffee Shop in Karachi. Explore our location and opening hours.">

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>

<body>

    <!-- Navbar -->
    <header>

        <nav class="navbar sticky">

            <a href="index.html">
                <img
                    src="./images/coffee logo (2).png"
                    alt="Java Buzz Logo"
                    class="logo">
            </a>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Home</a></li>
                <li><a href="menu.html" class="nav-item">Menu</a></li>
                <li><a href="location.html" class="nav-item">Location</a></li>
                <li><a href="blogs.html" class="nav-item">Blogs</a></li>
            </ul>

        </nav>

    </header>


    <main>

        <!-- Location Section -->
        <section class="location-page">

            <h1 class="section-title animate-slide-up">
                Visit Java Buzz
            </h1>

            <p>
                123 Coffee Street, Karachi, Pakistan
            </p>

            <div id="map"></div>

        </section>


        <!-- Opening Hours -->
        <section class="timing-section">

            <h2 class="section-title animate-fade-in">
                Opening Hours
            </h2>

            <div class="timing-card">

                <p>Monday - Friday : 8:00 AM - 10:00 PM</p>

                <p>Saturday : 9:00 AM - 11:00 PM</p>

                <p>Sunday : 10:00 AM - 11:00 PM</p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-content">
            <p>© 2026 Java Buzz Coffee Shop</p>
        </div>

    </footer>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
